<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Task Manager</h1>

    <form id="task-form" class="form" novalidate>
      <input type="text" id="task-name" placeholder="Nama tugas" aria-label="Nama tugas">

      <select id="task-priority" aria-label="Prioritas">
        <option value="Tinggi">Tinggi</option>
        <option value="Sedang">Sedang</option>
        <option value="Rendah">Rendah</option>
      </select>

      <input type="date" id="task-deadline" aria-label="Deadline">

      <button type="submit">Tambah</button>
    </form>

    <p id="form-error" class="error" role="alert"></p>

    <ul id="task-list"></ul>
    <p id="empty-state" class="empty">Belum ada tugas. Tambahkan tugas pertama Anda di atas.</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
